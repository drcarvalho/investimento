name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Tests & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      # O único alerta alto atual é transitivo do sqlite3@6 e ainda não possui versão corrigida.
      # O job continua exibindo o relatório e bloqueia qualquer vulnerabilidade crítica nova.
      - run: npm audit --audit-level=critical

  frontend:
    name: Frontend Tests, Build & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Audita dependências de produção (0 vulnerabilidades); alertas atuais em devDependencies são transitivos do vite/picomatch.
      - run: npm audit --omit=dev --audit-level=high

  python-engine:
    name: Python Quant Engine & Bot Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s engine/tests -v

